name: Bug report
description: Report an app or installation problem
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: App version, Android version and device model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened. Remove personal data from attachments.
    validations:
      required: true
