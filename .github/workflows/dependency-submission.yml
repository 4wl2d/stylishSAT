name: Dependency submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-submission:
    name: Submit Gradle dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: generate-and-submit
          additional-arguments: --no-daemon --no-configuration-cache --max-workers=2 --stacktrace
          validate-wrappers: true
