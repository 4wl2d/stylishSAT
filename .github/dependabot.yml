version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Belgrade
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Belgrade
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
