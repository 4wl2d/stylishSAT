name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Release build, tests and content
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the remote annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          previous_object="$(git rev-parse "$RELEASE_REF")"
          git fetch --no-tags origin "$RELEASE_REF"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          test "$(git rev-parse 'FETCH_HEAD^{}')" = "$(git rev-parse HEAD)"
          git update-ref "$RELEASE_REF" "$(git rev-parse FETCH_HEAD)" "$previous_object"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Validate public repository and version
        run: python3 tools/release/check_repository.py
      - name: Validate content and media
        run: |
          mkdir -p build
          python3 tools/content/validate_bank.py --report build/content-validation.json
      - name: Build release, run unit tests and lint
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest -PtestBuildType=release --no-daemon --max-workers=2 --console=plain
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            build/content-validation.json
          retention-days: 14
          if-no-files-found: error
